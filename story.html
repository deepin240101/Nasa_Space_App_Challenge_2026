    <script>
      // Play the intro on each visit unless the caller explicitly skips it.
      try {
        const params = new URLSearchParams(window.location.search);
        if (!params.has('skipIntro')) {
          const key = 'left-behind:progress';
          const saved = localStorage.getItem(key);
          const progress = saved ? JSON.parse(saved) : {
            state: { introSeen: false, visited: [], badges: [], favourite: null },
            version: 1
          };
          progress.state = { ...(progress.state || {}), introSeen: false };
          localStorage.setItem(key, JSON.stringify(progress));
        }
      } catch (error) {
        console.warn('Could not prepare the intro cut-scene:', error);
      }
    </script>

  <body>
    <div id="root"></div>
    <noscript>
      LEFT BEHIND needs JavaScript to run. It tells the true stories of NASA machines left on the
      Moon, on Mars and in deep space.
    </noscript>
    <script>
      // Make the "Left Behind" title (top-left) a link back to the home page.
      (function () {
        var HOME = 'index.html';
        var style = document.createElement('style');
        style.textContent =
          '[data-home-link]{cursor:pointer}[data-home-link]:focus-visible{outline:2px solid #f2a541;outline-offset:4px}';
        document.head.appendChild(style);

        function tag() {
          var walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT);
          var n;
          while ((n = walker.nextNode())) {
            if (n.nodeValue.trim().toLowerCase() !== 'left behind') continue;
            var el = n.parentElement;
            if (!el || el.hasAttribute('data-home-link')) continue;
            var r = el.getBoundingClientRect();
            if (r.top > 260 || r.left > 520) continue; // only the header title
            el.setAttribute('data-home-link', '');
            el.setAttribute('role', 'link');
            el.setAttribute('tabindex', '0');
            el.setAttribute('aria-label', 'Back to home page');
          }
        }

        var t = 0;
        new MutationObserver(function () {
          clearTimeout(t);
          t = setTimeout(tag, 150);
        }).observe(document.documentElement, { childList: true, subtree: true });
        window.addEventListener('load', tag);

        document.addEventListener(
          'click',
          function (e) {
            var h = e.target.closest && e.target.closest('[data-home-link]');
            if (h) { e.preventDefault(); window.location.href = HOME; }
          },
          true
        );
        document.addEventListener('keydown', function (e) {
          if (e.key !== 'Enter' && e.key !== ' ') return;
          var h = e.target.closest && e.target.closest('[data-home-link]');
          if (h) { e.preventDefault(); window.location.href = HOME; }
        });
      })();
    </script>
  </body>
